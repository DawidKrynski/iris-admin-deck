services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # After every start: start the metrics sampler, so the charts fill before anyone opens a page, and dismount
    # the demo database REPORTS again (see scripts/demo_seed.py) for the README's "A morning on call".
    # The second part does nothing on an image built with DEMO=0.
    command: --check-caps false --after "iris session IRIS -U USER '##class(AdminDeck.Metrics).Ensure()'; python3 /home/irisowner/dev/scripts/demo_seed.py --incident"
    ports:
      - "127.0.0.1:${ADMINDECK_PORT:-52785}:52773"
    volumes:
      - ./:/home/irisowner/dev
    # The image's own check fails while IRIS reports an "alert" state. Here that state comes from the demo data
    # (a certificate that expires soon, on purpose) and from the build host name differing from the container's,
    # so check what matters instead: the instance runs and the portal answers.
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | cut -d^ -f4 | grep -q '^running' && wget -q -O /dev/null http://localhost:52773/admindeck/index.html"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
